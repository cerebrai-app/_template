name: Release notes

# Writes the GitHub Release notes for each version tag (vX.Y.Z) with Claude
# Code. The steps live in cerebrai-app/actions (release-notes/action.yml and
# publish-release-notes/action.yml); triggers and permissions stay here.
#
# Runs when a version tag is pushed, or a release is published from the web UI,
# and can be started by hand for any existing tag to rewrite its notes. Pushes
# of other tags (e.g. a floating v1) do not start it; a release published for
# such a tag, or a manual run with one, fails at the release-notes action's tag
# check without writing anything. The release is created if it does not exist
# yet; this only ever writes the notes, never the release's files. With
# cerebrai-app/actions' go-release.yml (v3.2.0 or later) either workflow may
# create the release first: go-release.yml uploads its archives to an existing
# release and keeps its notes.
#
# Claude writes the notes in a job that can only read; a separate job with
# contents: write puts them on the release.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to write the notes for, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read

# A tag push and a release published from the web UI can both fire for the same
# tag; they queue, and the second finds the notes already written.
concurrency:
  group: release-notes-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  write:
    name: Write notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write # Claude Code authenticates through the Claude GitHub App
    outputs:
      skip: ${{ steps.notes.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and tags, to find the previous version
          persist-credentials: false

      - id: notes
        uses: cerebrai-app/actions/release-notes@82ef82d3c4d0f83552f282aed8ca98d5c92c0daa
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          tag: ${{ env.TAG }}
          rewrite: ${{ github.event_name == 'workflow_dispatch' }}
          # Optional: what this repository is and who reads its releases, to
          # steer the notes. Empty points Claude at the README.
          about: ''

  publish:
    name: Publish notes
    needs: write
    if: ${{ needs.write.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, or edit its notes
    steps:
      - uses: cerebrai-app/actions/publish-release-notes@82ef82d3c4d0f83552f282aed8ca98d5c92c0daa
        with:
          tag: ${{ env.TAG }}
